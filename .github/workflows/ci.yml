name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-11-03)
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # swatinem/rust-cache deletes every file under target/ that is outside a profile folder, which
      # empties the unpacked sherpa-onnx library but leaves its folder behind. The next build sees the
      # folder, skips the download, and cannot link (`could not find native static library
      # sherpa-onnx-c-api`) whenever sherpa-onnx-sys has to be recompiled. Dropping the folder and the
      # build script's cached result makes it download the library again (about 22 MB, seconds).
      - name: Drop the sherpa-onnx library the cache emptied
        shell: bash
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt src-tauri/target/*/build/sherpa-onnx-sys-* src-tauri/target/*/.fingerprint/sherpa-onnx-sys-*
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Frontend checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm format:check
      - name: Generated types are current
        run: |
          pnpm gen:types
          git diff --exit-code src/types/generated
      - name: Shortcut scripts (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/test-shortcuts.sh
      - name: Shortcut scripts (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-shortcuts.ps1
