name: installers
# Builds the installers for all three operating systems and keeps them as downloadable
# artifacts (spec §13 M6). No release is published and nothing is signed with a paid
# certificate: macOS is ad-hoc signed (D-13) and Windows is unsigned for the alpha.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/installers.yml
      - src-tauri/tauri.conf.json

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-11-03)
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # swatinem/rust-cache deletes every file under target/ that is outside a profile folder, which
      # empties the unpacked sherpa-onnx library but leaves its folder behind. The next build sees the
      # folder, skips the download, and cannot link (`could not find native static library
      # sherpa-onnx-c-api`) whenever sherpa-onnx-sys has to be recompiled. Dropping the folder and the
      # build script's cached result makes it download the library again (about 22 MB, seconds).
      - name: Drop the sherpa-onnx library the cache emptied
        shell: bash
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt src-tauri/target/*/build/sherpa-onnx-sys-* src-tauri/target/*/.fingerprint/sherpa-onnx-sys-*
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - name: Guard against mock transport
        shell: bash
        run: |
          if [ "${VITE_TRANSPORT:-}" = "mock" ]; then
            echo "::error::VITE_TRANSPORT is set to 'mock' in release build environment"
            exit 1
          fi
      - name: Build installers
        run: pnpm tauri build
      - name: Guard against mock bundle
        shell: bash
        run: |
          if [ ! -d dist ]; then
            echo "::error::dist/ directory does not exist"
            exit 1
          fi
          if grep -rq -e "mock\.app\.music" -e "Mock Music" dist/; then
            echo "::error::Mock transport detected in release bundle (dist/)"
            exit 1
          fi
      - name: Checksums
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \
            -o -name '*.AppImage' -o -name '*.rpm' \) -print0 | xargs -0 -I{} sh -c \
            'if command -v sha256sum >/dev/null; then sha256sum "{}"; else shasum -a 256 "{}"; fi' \
            | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jarvis-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
