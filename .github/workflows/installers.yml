name: installers
# Builds the installers for all three operating systems and keeps them as downloadable
# artifacts (spec §13 M6). No release is published and nothing is signed with a paid
# certificate: macOS is ad-hoc signed (D-13) and Windows is unsigned for the alpha.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/installers.yml
      - src-tauri/tauri.conf.json

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - name: Build installers
        run: pnpm tauri build
      - name: Checksums
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \
            -o -name '*.AppImage' -o -name '*.rpm' \) -print0 | xargs -0 -I{} sh -c \
            'if command -v sha256sum >/dev/null; then sha256sum "{}"; else shasum -a 256 "{}"; fi' \
            | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
