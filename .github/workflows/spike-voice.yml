name: spike-voice
# Builds the throwaway voice spike (spikes/voice-cli, task A-08) so a developer can download
# the program and run it on their own laptop without installing Rust. Not part of the app.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - spikes/voice-cli/**
      - .github/workflows/spike-voice.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes/voice-cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-11-03)
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: spikes/voice-cli
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - name: ONNX Runtime library (Linux and macOS; the oww commands load it from next to the program)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          V=1.31.0
          B=https://github.com/microsoft/onnxruntime/releases/download/v$V
          mkdir -p ort
          case "$RUNNER_OS" in
            Linux)
              curl -sSL -o ort/p.tgz "$B/onnxruntime-linux-x64-$V.tgz"
              tar xzf ort/p.tgz -C ort
              cp "ort/onnxruntime-linux-x64-$V/lib/libonnxruntime.so.$V" target/release/libonnxruntime.so ;;
            macOS)
              curl -sSL -o ort/p.tgz "$B/onnxruntime-osx-arm64-$V.tgz"
              tar xzf ort/p.tgz -C ort
              cp "ort/onnxruntime-osx-arm64-$V/lib/libonnxruntime.$V.dylib" target/release/libonnxruntime.dylib ;;
          esac
      - name: ONNX Runtime library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $V = "1.31.0"
          New-Item -ItemType Directory -Force ort | Out-Null
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$V/onnxruntime-win-x64-$V.zip" -OutFile ort/p.zip
          Expand-Archive ort/p.zip -DestinationPath ort -Force
          Copy-Item "ort/onnxruntime-win-x64-$V/lib/onnxruntime.dll", "ort/onnxruntime-win-x64-$V/lib/onnxruntime_providers_shared.dll" -Destination target/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-cli-${{ runner.os }}
          path: |
            spikes/voice-cli/target/release/voice-cli
            spikes/voice-cli/target/release/voice-cli.exe
            spikes/voice-cli/target/release/libonnxruntime.so
            spikes/voice-cli/target/release/libonnxruntime.dylib
            spikes/voice-cli/target/release/onnxruntime.dll
            spikes/voice-cli/target/release/onnxruntime_providers_shared.dll
          if-no-files-found: error
