[package]
name = "jarvis"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
regex = "1.13.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
ts-rs = "12.0.1"
uuid = { version = "1.29.0", features = ["v7"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-util = "0.7.20"
futures = "0.3.34"
async-trait = "0.1.92"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "rustls"] }
keyring = "4.2.0"
sha2 = "0.11.1"
zeroize = "1.9.1"


[target.'cfg(target_os = "macos")'.dependencies]
# Info.plist (binary or XML) for app bundle ids, platform/apps.rs.
plist = "1.10.3"

[target.'cfg(windows)'.dependencies]
# Start-menu shortcuts to their .exe targets, platform/apps.rs.
lnk = "0.6.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
