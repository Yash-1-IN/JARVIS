[package]
name = "jarvis"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
regex = "1.13.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
ts-rs = "12.0.1"
uuid = { version = "1.29.0", features = ["v7"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "fs"] }
tokio-util = "0.7.20"
futures = "0.3.34"
async-trait = "0.1.92"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "rustls"] }
keyring = "4.2.0"
sha2 = "0.11.1"
zeroize = "1.9.1"
# CPU, memory and network for the system.status tool, platform/status.rs.
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "network"] }
# Battery level and state for system.status, platform/status.rs (maintained fork of `battery`).
starship-battery = "0.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tauri-plugin-dialog = "2"
base64 = "0.23"
getrandom = "0.4"
# Microphone capture, audio/cpal_backend.rs (Apache-2.0). Same major version the S1 spike proved on all three OSes.
cpal = "0.15"
# Lock-free single-producer single-consumer ring between the audio callback and the voice thread,
# audio/capture.rs (MIT OR Apache-2.0, no dependencies): nothing allocates or locks in the callback.
rtrb = "0.4"
# The speech engine (D-26): Moonshine speech-to-text on the CPU through ONNX Runtime, voice/sherpa.rs
# (Apache-2.0). Its build downloads the prebuilt native library from the project's GitHub release.
sherpa-onnx = "2.0.1"
# Unpack the speech model archive (.tar.bz2) after its checksum is verified, voice/models.rs. Both are
# already in the build (sherpa-onnx's build script uses them), so no new package: tar is MIT OR Apache-2.0,
# bzip2 is MIT OR Apache-2.0 (its C library is bzip2-1.0.6, added to the allow-list in D-01 for #107).
tar = "0.4"
bzip2 = "0.4"
# The wake word's ONNX Runtime download is a .tgz (Linux, macOS) and a .zip (Windows), voice/models.rs.
# Both are already in the build (sherpa-onnx's build script uses them): flate2 is MIT OR Apache-2.0, zip is MIT.
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }


[target.'cfg(target_os = "macos")'.dependencies]
# Info.plist (binary or XML) for app bundle ids, platform/apps.rs.
plist = "1.10.3"

[target.'cfg(unix)'.dependencies]
# renameat2 (Linux) / renamex_np (macOS) for no-overwrite moves, platform/fs.rs.
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
# MoveFileExW without REPLACE_EXISTING for no-overwrite moves (platform/fs.rs) and the system
# volume keys (platform/media.rs).
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse"] }
# The system media session (pause, play, skip, now playing) for platform/media.rs; the volume
# keys use windows-sys above. Same version Tauri already pulls in, so no new crate in the tree.
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Win32_System_Com"] }
# Start-menu shortcuts to their .exe targets, platform/apps.rs.
lnk = "0.6.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: platform/apps.rs relies on catch_unwind to survive a parser
# panic on a malformed Start-menu shortcut (any program can write one), and the
# voice worker will need the same so an audio failure cannot crash the app (#21).
panic = "unwind"
strip = true

[dev-dependencies]
# Paused clock for the approval-expiry test; same crate, test builds only.
tokio = { version = "1.54.1", features = ["test-util"] }
